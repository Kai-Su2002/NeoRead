name: Release installers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac-benchmark:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: v0.9.2
      CSC_FOR_PULL_REQUEST: "true"
      NEOREAD_MAC_SIGN_P12: ${{ secrets.NEOREAD_MAC_SIGN_P12 }}
      NEOREAD_MAC_SIGN_P12_PASSWORD: ${{ secrets.NEOREAD_MAC_SIGN_P12_PASSWORD }}
      BENCH_TAG: bench-windows-20261026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d23aad55635cb371a806626406a7b062512e9f6a
          persist-credentials: false
      - name: Record hardware and source
        run: |
          git rev-parse HEAD
          system_profiler SPHardwareDataType | grep -E 'Model Name|Chip|Total Number of Cores|Memory' 
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Install dependencies
        run: |
          start=$SECONDS
          pnpm install --frozen-lockfile
          echo "BENCH install_seconds=$((SECONDS-start))"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/processor/models
          key: neoread-layout-model-${{ hashFiles('apps/processor/model.json') }}
      - name: Build installers and verify packaged runtimes
        run: |
          start=$SECONDS
          pnpm package
          echo "BENCH package_seconds=$((SECONDS-start))"
          shasum -a 256 release/NeoRead-0.9.2-mac-arm64.dmg release/NeoRead-0.9.2-mac-arm64.zip
      - name: Upload installers directly to benchmark draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/NeoRead-0.9.2-mac-arm64.dmg release/cloud-mac-arm64.dmg
          cp release/NeoRead-0.9.2-mac-arm64.zip release/cloud-mac-arm64.zip
          start=$SECONDS
          gh release upload "$BENCH_TAG" release/cloud-mac-arm64.dmg release/cloud-mac-arm64.zip --repo cynicalight/NeoRead
          echo "BENCH release_upload_seconds=$((SECONDS-start))"
